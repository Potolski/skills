name: Refresh registry

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh registry + mirrors from GitHub
        run: node scripts/refresh.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every advertised external link is alive
        run: node scripts/check-links.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with refreshed data
        run: npm run build
      - name: Verify served bytes match advertised sha256 pins
        run: node scripts/verify-integrity.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Registry already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore(data): weekly registry refresh"
          git push
