name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify hosted skill files are verbatim mirrors
        run: |
          for f in src/data/skills/*.md; do
            id=$(basename "$f")
            cmp "$f" "dist/s/$id" || { echo "::error::dist/s/$id is not a verbatim mirror"; exit 1; }
          done
